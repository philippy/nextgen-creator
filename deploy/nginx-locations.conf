# Inclua dentro do bloco server HTTPS do subdomínio do Nextgen Creator.
client_max_body_size 10m;

location /static/ {
    alias /opt/nextgen-creator/staticfiles/;
    expires 1h;
}

location / {
    proxy_pass http://127.0.0.1:8031;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /configuracoes/google/retorno/ {
    access_log off;
    proxy_pass http://127.0.0.1:8031;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
